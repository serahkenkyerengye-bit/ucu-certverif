name: Test contract and publish web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blockchain/package-lock.json
      - run: npm ci
        working-directory: blockchain
      - run: npx hardhat test
        working-directory: blockchain

  build:
    needs: test-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_CHAIN_ID: "11155111"
          VITE_CONTRACT_ADDRESS: ${{ vars.CONTRACT_ADDRESS }}
          VITE_CONTRACT_BLOCK: ${{ vars.CONTRACT_BLOCK }}
          VITE_SEPOLIA_RPC: ${{ vars.SEPOLIA_RPC }}
          VITE_PINATA_JWT: ${{ secrets.PINATA_JWT }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
